run:
  timeout: 5m
  tests: false

linters:
  enable:
    - govet
    - staticcheck
    - gosimple
    - errcheck
    - ineffassign
    - typecheck
    - unused
    - misspell
    - gocritic
    - revive
    - gofumpt
    - dupl

linters-settings:
  revive:
    rules:
      - name: var-naming
      - name: exportloopref
      - name: if-return
      - name: indent-error-flow
      - name: empty-block
  misspell:
    locale: US

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - gocritic
